<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0B2F2E" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Anek+Latin:wght@400;500;600;700;800&family=Anek+Bangla:wght@400;500;600;700&family=Anek+Devanagari:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap"
    />
    <title>Karigar Ops</title>
    <!-- Apply the saved colour theme before first paint (no light flash). Key must match src/lib/color-theme.ts. -->
    <script>
      try {
        var preference = localStorage.getItem('karigar-admin.color-theme');
        var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.dataset.theme =
          preference === 'dark' || (preference !== 'light' && prefersDark) ? 'dark' : 'light';
      } catch (error) {
        document.documentElement.dataset.theme = 'light';
      }
    </script>
  </head>
  <body>
    <div id="root">
      <!-- Shown until React mounts (same look as RouteLoadingFallback); replaced on first render. -->
      <div class="bg-brand-soft grid min-h-dvh place-items-center" role="status">
        <div class="flex flex-col items-center gap-4">
          <span
            class="border-primary size-[76px] rounded-full border-4 border-r-transparent motion-safe:animate-spin"
            aria-hidden="true"
          ></span>
          <p class="text-fg-muted font-sans text-sm font-semibold">Loading Karigar Ops…</p>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
